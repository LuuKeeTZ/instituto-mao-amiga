spring.application.name=instituto-mao-amiga-api
# Os testes usam um banco em memória para não mexer no arquivo data/maoamiga
spring.datasource.url=jdbc:h2:mem:testes;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
