spring.application.name=instituto-mao-amiga-api
server.port=8080

# Banco H2 gravado em arquivo (pasta data/ ao lado do pom.xml), sobrevive a reinícios
spring.datasource.url=jdbc:h2:file:./data/maoamiga
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Page serializado como { "content": [...], "page": { size, number, totalElements, totalPages } }
spring.data.web.pageable.serialization-mode=via_dto

# Console do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger UI em http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
